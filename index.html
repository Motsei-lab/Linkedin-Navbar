<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linkedin Navbar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <div class="logo">
            <img  class="image"src="logo-linkedin.svg" alt="LinkedIn Logo">
            <input type="text" class="search-bar" placeholder="Search">
        </div>
        
        <div class="icons-onright">
                <figure>
                    <img class="homeImg" src="home-outline.svg" alt="Home Icon">
                    <figcaption>Home</figcaption>
                </figure>
                <figure>
                    <img class="netwrokImg" src="people-outline.svg" alt="Network Icon">
                    <figcaption>Network</figcaption>
                </figure>
                <figure>
                    <img class="jobsImg" src="briefcase-outline.svg" alt="Jobs Icon">
                    <figcaption>Jobs</figcaption>
                </figure>
                <figure>
                    <img class="messagingImg" src="chatbubbles-outline.svg" alt="Messaging Icon">
                    <figcaption>Messaging</figcaption>
                </figure>
                <figure>
                    <img class="notificationsImg" src="notifications-outline.svg" alt="Notifications Icon">
                    <figcaption>Notifications</figcaption>
                </figure>
                <figure>
                    <img class="profileImg" src="person-circle-outline.svg" alt="Profile Icon">
                    <figcaption>Profile</figcaption>
                </figure>
            
        </div>
        <div class="far-right">
           <figure>
             <img class="workImg" src="keypad-outline.svg" alt="Work Icon">
             <figcaption>For Business</figcaption>
           </figure>
           <figure>
             <img class="premiumImg" src="square-outline.svg" alt="Premium Icon">
             <figcaption>Premium</figcaption>
           </figure>
        </div>
    </div>
</body>
</html>
